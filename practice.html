ckpoint"},{"id":"checkpoint-2-q1","type":"single","prompt":"Mubadir's flow now has a checkpointer. A ticket service timeout still produced two tickets for one report. Why?","options":[{"key":"A","text":"The checkpointer was not saving"},{"key":"B","text":"The ticket database lost the first ticket"},{"key":"C","text":"The retry ran inside one step, and the service had no key to recognise it"},{"key":"D","text":"The model asked for two tickets"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"The service committed and its answer was lost; only an idempotency key lets it return the first ticket.","misconceptions":["The checkpoint was there; it does not cover a retry inside a step","Durability of the database is not the issue: both writes were kept","","A model choice cannot make the service write twice"],"lo":["LO5"],"day":4,"session":2,"slide":{"deck":"day4","id":"checkpoint-2","title":"Checkpointed, still duplicated"},"level":null,"pool":"checkpoint"},{"id":"checkpoint-3-q1","type":"single","prompt":"The team wants to reproduce INC-0412 by sending the same customer report to Mubadir today. Why will that probably not show the failure?","options":[{"key":"A","text":"The replica has caught up and the model may answer differently: only the recording holds what happened"},{"key":"B","text":"The customer's account has been deleted"},{"key":"C","text":"The new guard will block it"},{"key":"D","text":"Agents never behave the same way twice"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"Replay uses the stored model outputs and tool responses, so the same failure returns every time.","misconceptions":["","The account still exists; the data has simply moved on","A guard that is not yet written cannot block anything","Agents are not random by design; the inputs changed"],"lo":["LO5"],"day":4,"session":3,"slide":{"deck":"day4","id":"checkpoint-3","title":"Reproduce it"},"level":null,"pool":"checkpoint"},{"id":"checkpoint-4-q1","type":"single","prompt":"Every session of Mubadir's new version loops on the same pending status. Each stops at the step limit. What does the duty engineer do?","options":[{"key":"A","text":"Nothing: the step limit already stops each session"},{"key":"B","text":"Stop all of Mubadir, every version"},{"key":"C","text":"Raise the step limit so sessions can finish"},{"key":"D","text":"Turn on the kill switch for that version and hand its sessions to people"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"When the cause is shared, one switch per version stops the waste at once and keeps the customers served by people or the previous version.","misconceptions":["Pays for every session's loop when the cause is shared","Stops service for everyone, including the working version","Raises the cost of each loop and fixes nothing",""],"lo":["LO5"],"day":4,"session":4,"slide":{"deck":"day4","id":"checkpoint-4","title":"Six sessions looping"},"level":null,"pool":"checkpoint"},{"id":"q-d1-manifest-hash","type":"single","prompt":"Wahaj keeps a release number that people increase by hand. A teammate edits Nabd's tool schema and forgets to increase it. Which practice would have shown the change?","options":[{"key":"A","text":"A manifest whose release id is a hash of every part"},{"key":"B","text":"A stricter reminder in the team's release checklist"},{"key":"C","text":"Running the evaluation set once a month"},{"key":"D","text":"Keeping the release number in the prompt file"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"A content hash changes whenever any part changes, whether or not anyone remembered to bump a number.","misconceptions":["","Relies on memory, the thing that failed","Detects a behaviour change late and does not say which part changed","Moves the number without making it follow the content"],"lo":["LO1"],"day":1,"session":1,"slide":null,"level":"understand","pool":"practice"},{"id":"q-d1-served-model","type":"single","prompt":"Nabd's release names a provider alias that ends in \"latest\". What should each call's log record so that a silent model change shows up in a diff?","options":[{"key":"A","text":"The prompt text only"},{"key":"B","text":"The model identifier returned in the response"},{"key":"C","text":"The alias the release asked for"},{"key":"D","text":"The number of tokens of the answer"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"The response names the model that actually served the call; the alias can point at a different snapshot tomorrow.","misconceptions":["Assumes the prompt is the only part that can change behaviour","","Records the pointer, which looks the same before and after it moves","Records a symptom that varies for many reasons"],"lo":["LO1"],"day":1,"session":1,"slide":null,"level":"apply","pool":"practice"},{"id":"q-d1-index-part","type":"single","prompt":"Nabd's prompt, model and tools are unchanged, but the manuals index was rebuilt with a revised manual. Is this a new release?","options":[{"key":"A","text":"No: only the data changed, not the system"},{"key":"B","text":"No, unless the answers get worse"},{"key":"C","text":"Yes: the index is part of what changes behaviour"},{"key":"D","text":"Only if the index is larger than before"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"The retrieval index decides which text the model sees, so a rebuilt index is a change to the release unit.","misconceptions":["Treats the retrieval index as data outside the release","Decides by outcome after the fact instead of by what changed","","Ties the release to size instead of content"],"lo":["LO1"],"day":1,"session":1,"slide":null,"level":"understand","pool":"practice"},{"id":"q-d1-reproduce-proof","type":"single","prompt":"You retrain the champion from its registry lineage. Which evidence proves you reproduced it?","options":[{"key":"A","text":"The same AUC on the holdout to three decimals"},{"key":"B","text":"The same number of trees in both models"},{"key":"C","text":"The same file name for the training data"},{"key":"D","text":"The same data hash, the same code hash and identical predictions row by row"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"Equal inputs (data and code hashes) and equal outputs (every prediction) are the proof; a metric alone is not.","misconceptions":["Two different models can share a metric","Shape is not behaviour","A file name says nothing about its rows",""],"lo":["LO1"],"day":1,"session":2,"slide":null,"level":"analyze","pool":"practice"},{"id":"q-d1-param-strings","type":"single","prompt":"A retraining script reads the champion's parameters back from the tracking store and passes them straight to the trainer. It fails on the sample weight. Why?","options":[{"key":"A","text":"The tracking store returns parameters as strings"},{"key":"B","text":"The champion was trained with a different library"},{"key":"C","text":"The registry deleted the parameter after promotion"},{"key":"D","text":"Sample weights cannot be logged"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"Parameters are stored as text, so code that retrains from the registry converts each one back to its type.","misconceptions":["","Guesses at the environment before reading the error","Parameters stay with the run","Confuses logging with typing"],"lo":["LO2"],"day":1,"session":2,"slide":null,"level":"apply","pool":"practice"},{"id":"q-d1-contract-before-train","type":"single","prompt":"A monthly batch arrives with one region's load written as a fraction. Which design stops it doing harm?","options":[{"key":"A","text":"Train, then reject the model if its AUC falls"},{"key":"B","text":"A contract step before training that stops the run and reports the column"},{"key":"C","text":"A cleaning step that rescales small loads"},{"key":"D","text":"Let the crews report odd inspection lists"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"The contract names the broken column before any model learns from it and sends the report to the owner of the source.","misconceptions":["A model trained and scored on broken data can still score well","","Repairs a fault the data owner has not confirmed","Detection after the damage, by the people it hurts"],"lo":["LO2"],"day":1,"session":3,"slide":null,"level":"apply","pool":"practice"},{"id":"q-d1-lazy-validation","type":"single","prompt":"Why does Lab 1.3 validate the batch lazily, collecting every failure?","options":[{"key":"A","text":"It is faster than stopping at the first failure"},{"key":"B","text":"Because pandera cannot stop at the first failure"},{"key":"C","text":"So the data owner can fix every problem in one delivery"},{"key":"D","text":"So the pipeline can repair the failing rows"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"One report with every failure saves a round trip per problem with the team that owns the export.","misconceptions":["Speed is not the reason","It can; lazy is a choice","","Validation reports; it does not repair"],"lo":["LO2"],"day":1,"session":3,"slide":null,"level":"understand","pool":"practice"},{"id":"q-d1-region-gate","type":"single","prompt":"A challenger beats the champion overall and is 0.07 AUC worse in one region; the gate's tolerance is 0.03. What should the gate do?","options":[{"key":"A","text":"Promote: the overall gain outweighs one region"},{"key":"B","text":"Raise the tolerance for this release"},{"key":"C","text":"Promote and watch that region closely"},{"key":"D","text":"Reject it, and record the region and the reason"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"The regional rule is set before the release; a loss far beyond the noise in one region blocks promotion.","misconceptions":["Lets an average hide the people who pay for it","Changes the rule to pass a candidate","Ships a known regression and hopes a monitor catches it",""],"lo":["LO2"],"day":1,"session":4,"slide":null,"level":"evaluate","pool":"practice"},{"id":"q-d1-tolerance","type":"single","prompt":"Why does the promotion gate allow a small drop in a region instead of none at all?","options":[{"key":"A","text":"A region's AUC on a few hundred feeders varies by a few hundredths between samples"},{"key":"B","text":"Small regions matter less to the company"},{"key":"C","text":"Challengers are always slightly worse in some region"},{"key":"D","text":"The champion's scores are rounded"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"Without a tolerance the gate would reject almost every challenger on sampling noise; the bootstrap measures its size.","misconceptions":["","Treats a fairness rule as a business weight","Not a law; it is noise","Rounding is far smaller than the tolerance"],"lo":["LO2"],"day":1,"session":4,"slide":null,"level":"understand","pool":"practice"},{"id":"q-d1-promote-alias","type":"single","prompt":"Serving loads models:/fault-risk@champion. What is the release when challenger B passes the gate?","options":[{"key":"A","text":"Copy B's model file into the service image"},{"key":"B","text":"Move the champion alias to B, keep previous-champion on the old version, tag the reason"},{"key":"C","text":"Delete the old champion version"},{"key":"D","text":"Retrain B on all data and register it"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"Moving an alias is one recorded, reversible change; the previous version stays one move away.","misconceptions":["Bypasses the registry and loses the audit record","","Removes the rollback","Ships a model the gate never saw"],"lo":["LO2"],"day":1,"session":4,"slide":null,"level":"apply","pool":"practice"},{"id":"q-d2-promote-digest","type":"single","prompt":"Staging tested Nabd's image yesterday. Today the production job builds the image again from the same commit and deploys it. Why is this a problem?","options":[{"key":"A","text":"The commit may have been changed since yesterday"},{"key":"B","text":"A second build takes longer than a deploy"},{"key":"C","text":"The production build may differ from what staging tested"},{"key":"D","text":"Production needs a different tag than staging"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"Only the digest that passed staging is known to work; a rebuild can pull newer base images or packages.","misconceptions":["Commits are immutable; base images and packages are not","Treats the issue as speed, not identity","","A different tag is still a different build"],"lo":["LO3"],"day":2,"session":1,"slide":null,"level":"understand","pool":"practice"},{"id":"q-d2-approval-location","type":"single","prompt":"Dhafer wants production deploys of Nabd to need an approval that a pull request cannot remove. Where does he put the rule on GitHub?","options":[{"key":"A","text":"In a step of the workflow file that waits for a comment"},{"key":"B","text":"In a branch name convention"},{"key":"C","text":"In the README of the repository"},{"key":"D","text":"In the production environment's protection rules"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"Required reviewers on the environment are repository settings, outside the files a pull request can change.","misconceptions":["A pull request can edit the file and remove the step","Names do not stop a job from running","Documentation does not enforce anything",""],"lo":["LO3"],"day":2,"session":1,"slide":null,"level":"apply","pool":"practice"},{"id":"q-d2-self-review","type":"single","prompt":"Dhafer merged a change to Nabd and is also on the production reviewer list. Self-review is blocked. Who can approve the release?","options":[{"key":"A","text":"Another listed reviewer, such as Mutab"},{"key":"B","text":"Anyone in the team with write access"},{"key":"C","text":"Dhafer, because he is a reviewer"},{"key":"D","text":"Nobody: the release must be merged again by someone else"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"One approval from a listed reviewer who did not merge lets the production job start.","misconceptions":["","Ignores the reviewer list","Ignores the self-review rule","Invents a rule; one other reviewer is enough"],"lo":["LO3"],"day":2,"session":1,"slide":null,"level":"apply","pool":"practice"},{"id":"q-d2-one-part","type":"single","prompt":"A candidate release of Nabd changes the prompt and the model at once, and the gate blocks it. What is the main drawback of this release?","options":[{"key":"A","text":"It costs more to evaluate"},{"key":"B","text":"The result does not say which change caused the block"},{"key":"C","text":"It must be rolled back twice"},{"key":"D","text":"The gate cannot run on two changes"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"Changing one part per release lets a gate result point at its cause.","misconceptions":["Evaluation cost is the same for any candidate","","A rollback restores the whole release at once","The gate runs; the problem is reading its result"],"lo":["LO3"],"day":2,"session":2,"slide":null,"level":"understand","pool":"practice"},{"id":"q-d2-safety-floor","type":"single","prompt":"A cheaper model keeps answer correctness at 0.917 but completes 5 of 6 safety procedures. The gate has a floor of 1.00 on safety steps. What is the decision?","options":[{"key":"A","text":"Ship: the overall score is unchanged"},{"key":"B","text":"Ship to half the crews to compare"},{"key":"C","text":"Block, and log the safety metric and the failing case"},{"key":"D","text":"Rerun the gate until it passes"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"A floor with no allowed drop blocks the release on one failure; the log names the metric and the case.","misconceptions":["Lets an average decide a rule written as a floor","Exposes crews to an incomplete isolation procedure","","Games the gate instead of fixing the model"],"lo":["LO3"],"day":2,"session":2,"slide":null,"level":"analyze","pool":"practice"},{"id":"q-d2-index-gate","type":"single","prompt":"The platform team refreshes Nabd's manuals index without changing code, prompt or model. Should the refresh go through the evaluation gate?","options":[{"key":"A","text":"Only if the number of chunks changes"},{"key":"B","text":"No: no code changed"},{"key":"C","text":"No: new manuals can only improve answers"},{"key":"D","text":"Yes: it changes what the model reads"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"The index decides the context; a refresh is a release and is gated like one.","misconceptions":["Content can change with the same chunk count","Treats code as the only part that changes behaviour","A new section can outrank the right one or split a procedure",""],"lo":["LO3"],"day":2,"session":2,"slide":null,"level":"understand","pool":"practice"},{"id":"q-d2-min-sample","type":"single","prompt":"At 5% the canary served 30 requests in its pause with no problems. The analysis's minimum sample is 50. What should happen?","options":[{"key":"A","text":"Report inconclusive and extend the pause"},{"key":"B","text":"Roll back"},{"key":"C","text":"Advance to 25%"},{"key":"D","text":"Lower the minimum sample for this release"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"Below the minimum sample there is no evidence either way: wait, then hand the decision to a person.","misconceptions":["","Punishes low traffic instead of a problem","Treats a quiet window as evidence","Changes the rule to fit the data"],"lo":["LO3"],"day":2,"session":3,"slide":null,"level":"apply","pool":"practice"},{"id":"q-d2-paired","type":"single","prompt":"Why does the canary analysis compare the candidate's graded answers with the stable version's grades on the same requests rather than with last week's average?","options":[{"key":"A","text":"Last week's average is not stored"},{"key":"B","text":"The same requests remove the effect of a changing question mix"},{"key":"C","text":"It makes the canary faster"},{"key":"D","text":"The stable version is always right"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"The question mix changes through the day; a paired comparison leaves only the difference between versions.","misconceptions":["The issue is validity, not storage","","Pairing does not change speed","The stable version is a baseline, not a truth"],"lo":["LO3"],"day":2,"session":3,"slide":null,"level":"analyze","pool":"practice"},{"id":"q-d2-shadow-miss","type":"single","prompt":"A new model snapshot passed the offline gate and 30 minutes of shadow, then failed at 25% when the next shift asked mostly in Arabic. What should change before the next attempt?","options":[{"key":"A","text":"Skip the shadow: it was misleading"},{"key":"B","text":"Raise the latency objective"},{"key":"C","text":"Add Arabic cases offline and shadow across a shift change"},{"key":"D","text":"Go straight to 50% to get a larger sample"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"A candidate is tested only on the traffic it sees; the instruments need traffic like the failing shift.","misconceptions":["Removes a safe source of evidence","Moves the rule instead of the evidence","","Exposes more users to a known failure"],"lo":["LO3"],"day":2,"session":3,"slide":null,"level":"analyze","pool":"practice"},{"id":"q-d2-random-assign","type":"single","prompt":"A new reply style for Mubadir won offline. It went live in one region first, and that region now has 9 points fewer repeat contacts than the others. How do you measure the style's own effect?","options":[{"key":"A","text":"Compare the region with the other five regions again over the next month"},{"key":"B","text":"Compare the region with its own month before the change"},{"key":"C","text":"Assign accounts at random in every region and compare the two arms"},{"key":"D","text":"Grade the new replies with the offline grader on live traffic"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"Random assignment makes the two groups alike in everything but the style, so the difference left is the style plus chance, which the interval measures.","misconceptions":["Keeps the region's own differences inside the comparison","Mixes the style with everything else that changed between the months","","Measures the reply again, not the customer's later outcome"],"lo":["LO3"],"day":2,"session":3,"slide":null,"level":"analyze","pool":"practice"},{"id":"q-d2-cost-per-success","type":"single","prompt":"A configuration halves Mubadir's cost per model call, but its resolved share drops from 0.70 to 0.40. About how does the cost per resolved report change?","options":[{"key":"A","text":"It halves"},{"key":"B","text":"It is unchanged"},{"key":"C","text":"It doubles"},{"key":"D","text":"It falls only slightly, and unresolved reports need a person"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"0.5 x 0.70 / 0.40 is about 0.88 of the old cost per success, before the extra human work.","misconceptions":["Divides by calls, not outcomes","Ignores both the price and the success rate","Ignores that each call is cheaper",""],"lo":["LO6"],"day":2,"session":4,"slide":null,"level":"apply","pool":"practice"},{"id":"q-d2-cache","type":"single","prompt":"Someone added the current date as the first line of Nabd's system prompt, and the cache hit rate fell from 0.62 to 0.12. Why?","options":[{"key":"A","text":"Prompt caches match the start of a request, and the start now changes daily"},{"key":"B","text":"The provider stopped caching dates"},{"key":"C","text":"Dates make prompts longer"},{"key":"D","text":"Cached tokens expire at midnight"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"Stable text belongs first and changing text last, so the cached prefix stays the same.","misconceptions":["","Invents a provider rule","Length is not the cause","The cause is the changing prefix, not expiry"],"lo":["LO6"],"day":2,"session":4,"slide":null,"level":"understand","pool":"practice"},{"id":"q-d2-forecast-false","type":"single","prompt":"A month-end forecast alert fires for the fault-risk classifier on the 7th; its spend jumped on the day of the planned monthly retrain. What is the best fix?","options":[{"key":"A","text":"Remove budget alerts for the classifier"},{"key":"B","text":"Forecast planned jobs separately from daily running cost"},{"key":"C","text":"Raise the classifier's budget until the alert stops"},{"key":"D","text":"Alert only on the last day of the month"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"A planned job inside the forecast window inflates the projection; treat it as a known item.","misconceptions":["Loses the signal for real overspend","","Hides the cause behind a bigger number","Too late to act"],"lo":["LO6"],"day":2,"session":4,"slide":null,"level":"analyze","pool":"practice"},{"id":"q-d2-showback","type":"single","prompt":"Finance asks why AI costs are shown per team instead of as one platform bill. What is the main reason?","options":[{"key":"A","text":"It is required to move money between teams"},{"key":"B","text":"It makes the total bill smaller"},{"key":"C","text":"Teams decide their use, so seeing their own cost changes their choices"},{"key":"D","text":"It hides the cost of the platform team"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"Showback puts cost in front of the people who choose how much to use.","misconceptions":["That is chargeback, not showback","Showing costs does not reduce them by itself","","Showback is about visibility, not hiding"],"lo":["LO6"],"day":2,"session":4,"slide":null,"level":"understand","pool":"practice"},{"id":"q-d3-span-tree","type":"single","prompt":"Nabd's logs say a request took 500 ms. What does a trace add?","options":[{"key":"A","text":"The cost of the request"},{"key":"B","text":"The average time of all requests that day"},{"key":"C","text":"The text of the answer"},{"key":"D","text":"The time of each step of that request, nested under it"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"A trace holds one span per step with its parent and duration, so the slow step is visible.","misconceptions":["Token counts can be attributes, but the point is the step breakdown","That is a metric, not a trace","Content is not what makes a trace useful, and it may hold personal data",""],"lo":["LO4"],"day":3,"session":1,"slide":null,"level":"understand","pool":"practice"},{"id":"q-d3-slowest-step","type":"single","prompt":"Ten traces show retrieval at 71% of request time and model calls at 27%. Where do you start?","options":[{"key":"A","text":"Find why retrieval is slow and fix it, then measure again"},{"key":"B","text":"Add replicas"},{"key":"C","text":"Swap to a faster model"},{"key":"D","text":"Remove the tool calls"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"Fix the largest step and confirm with the same spans.","misconceptions":["","More copies repeat the same slow work","Optimises the smaller part","Tools are 2% of the time"],"lo":["LO4"],"day":3,"session":1,"slide":null,"level":"apply","pool":"practice"},{"id":"q-d3-span-pii","type":"single","prompt":"A developer wants to record every crew question as a span attribute. Questions sometimes contain a customer's phone number. What is the rule?","options":[{"key":"A","text":"Record it: traces are internal"},{"key":"B","text":"Record it only after redaction, and only if a purpose needs it"},{"key":"C","text":"Record it only on error spans"},{"key":"D","text":"Record it and delete the trace store yearly"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"Data that leaves the service in traces is collected and stored; keep only what the purpose needs.","misconceptions":["Traces are copied and kept by many people","","Errors can contain personal data too","Stores personal data without a purpose for a year"],"lo":["LO4"],"day":3,"session":1,"slide":null,"level":"understand","pool":"practice"},{"id":"q-d3-conventions","type":"single","prompt":"Which span name follows the OpenTelemetry GenAI conventions for one model call of Nabd?","options":[{"key":"A","text":"nabd.model.call"},{"key":"B","text":"LLM"},{"key":"C","text":"chat steady"},{"key":"D","text":"retrieval steady"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"The conventions name a span by operation and target, such as chat with the model name.","misconceptions":["A private name back ends do not recognise","Not an operation name and carries no target","","Retrieval is a different operation"],"lo":["LO4"],"day":3,"session":1,"slide":null,"level":"remember","pool":"practice"},{"id":"q-d3-persistence","type":"single","prompt":"A drift monitor alerts every hot day in summer. Which change removes these alarms but still catches a shift that lasts?","options":[{"key":"A","text":"Raise the threshold to 2.0"},{"key":"B","text":"Remove temperature from the monitor"},{"key":"C","text":"Monitor once a month"},{"key":"D","text":"Alert only on three judged days in a row"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"Persistence filters one-day spikes and keeps sustained moves.","misconceptions":["Also hides real shifts","Loses a feature that matters to the model","Delays real alerts by weeks",""],"lo":["LO4"],"day":3,"session":2,"slide":null,"level":"apply","pool":"practice"},{"id":"q-d3-rolling","type":"single","prompt":"The monitor compares each day with the previous seven days. What can it no longer see?","options":[{"key":"A","text":"A slow drift over months"},{"key":"B","text":"A one-day spike"},{"key":"C","text":"A step change overnight"},{"key":"D","text":"A day with few feeders"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"A rolling reference absorbs slow change, so keep a fixed comparison with the training data as well.","misconceptions":["","It sees it; persistence decides not to alert","A step stands out against the previous week","The minimum sample handles that"],"lo":["LO4"],"day":3,"session":2,"slide":null,"level":"analyze","pool":"practice"},{"id":"q-d3-skew","type":"single","prompt":"Serving load jumps 12% overnight while temperatures fall. The SCADA team recalibrated meters that night. What should Lamya do?","options":[{"key":"A","text":"Retrain at once on the new values"},{"key":"B","text":"Treat it as skew and fix the data with the SCADA team before any retraining"},{"key":"C","text":"Ignore it: load is only one feature"},{"key":"D","text":"Lower the alert threshold"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"Serving computing a feature differently from training is skew; fix the data, not the model.","misconceptions":["Teaches the model a measurement error","","A wrong feature changes every score","The alert already worked"],"lo":["LO4"],"day":3,"session":2,"slide":null,"level":"analyze","pool":"practice"},{"id":"q-d3-min-sample","type":"single","prompt":"On maintenance-freeze days only 120 feeders are scored instead of 400. Why does the monitor not judge those days?","options":[{"key":"A","text":"The feeders are not important"},{"key":"B","text":"The data is corrupt on those days"},{"key":"C","text":"A small sample makes the statistic noisy"},{"key":"D","text":"The model is not used on those days"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"A drift statistic on a small sample moves by chance; a minimum sample avoids false alarms.","misconceptions":["Importance is not the reason","The data is valid, just small","","It still scores the 120"],"lo":["LO4"],"day":3,"session":2,"slide":null,"level":"understand","pool":"practice"},{"id":"q-d3-shadow-evidence","type":"single","prompt":"A replacement fault-risk model has been scored in shadow for two weeks. Faults reported so far favour it slightly, but most Al-Jabal faults are found weeks later. What should you add before deciding?","options":[{"key":"A","text":"Two more weeks of the same early faults"},{"key":"B","text":"A lower alert threshold on the shadow scores"},{"key":"C","text":"The share of today's feeders on which the two models' top lists agree"},{"key":"D","text":"A backtest on a complete month and a random inspected sample"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"Early outcomes leave out the late region where the models differ; a backtest on mature labels and an inspected random sample from the disagreements give evidence now.","misconceptions":["Adds more of the same biased sample","Changes the decision rule instead of adding evidence","Shows where the models differ but not which one is right",""],"lo":["LO4"],"day":3,"session":2,"slide":null,"level":"analyze","pool":"practice"},{"id":"q-d3-redact-when","type":"single","prompt":"Where in the online evaluation should personal data be removed from Nabd's traces?","options":[{"key":"A","text":"Before they are shown to reviewers"},{"key":"B","text":"Never: the grader needs it"},{"key":"C","text":"After a year"},{"key":"D","text":"Before they are stored"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"Data that is never stored needs no access rule and no deletion.","misconceptions":["Stored data can still be copied and read","The grader needs the answer and context, not the customer","Keeps data without purpose",""],"lo":["LO4"],"day":3,"session":3,"slide":null,"level":"understand","pool":"practice"},{"id":"q-d3-correct-rate","type":"single","prompt":"A grader fails 29% of sampled answers. On labelled traces it fails 90% of bad answers and passes 82% of good ones. About what failure rate do you report?","options":[{"key":"A","text":"15%, with the raw rate and the sample sizes"},{"key":"B","text":"29%"},{"key":"C","text":"10%"},{"key":"D","text":"32%"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"(0.29 + 0.82 - 1) / (0.90 + 0.82 - 1) is about 0.15.","misconceptions":["","Reports the grader's reading as the true rate","Uses one minus sensitivity, which is not the rate","Divides by sensitivity and ignores false failures"],"lo":["LO4"],"day":3,"session":3,"slide":null,"level":"apply","pool":"practice"},{"id":"q-d3-review-passes","type":"single","prompt":"Why does the review queue include a few answers the grader passed?","options":[{"key":"A","text":"To keep reviewers busy"},{"key":"B","text":"To see what the grader lets through and keep its numbers current"},{"key":"C","text":"To check the grader's speed"},{"key":"D","text":"Because passes are usually wrong"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"Random passes measure the grader's misses and refresh its sensitivity.","misconceptions":["Not a purpose","","Speed is not reviewed by people","Most passes are right"],"lo":["LO4"],"day":3,"session":3,"slide":null,"level":"understand","pool":"practice"},{"id":"q-d3-retention","type":"single","prompt":"Traces are kept 3 days for debugging. Some are in the review queue on day 7. What does the retention rule do with them?","options":[{"key":"A","text":"Deletes them with the others"},{"key":"B","text":"Keeps them forever"},{"key":"C","text":"Holds them until reviewed, then deletes them"},{"key":"D","text":"Keeps all traces until the queue is empty"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"Keep data while a stated purpose needs it, then destroy it.","misconceptions":["Removes data a reviewer still needs","No purpose after review","","Holds unrelated data"],"lo":["LO4"],"day":3,"session":3,"slide":null,"level":"apply","pool":"practice"},{"id":"q-d3-labels-wait","type":"single","prompt":"A drift alert fires on 20 September for August's feeders. August's labels are complete on 2 October. What does the retraining policy do?","options":[{"key":"A","text":"Promote the last challenger"},{"key":"B","text":"Retrain now on the first cut"},{"key":"C","text":"Ignore the alert"},{"key":"D","text":"Wait for complete labels, then retrain and gate"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"The missing labels are the high-risk mountain feeders; training without them teaches the gap.","misconceptions":["Not evidence for this change","Learns the gap where inspections are late","Discards a real signal",""],"lo":["LO2"],"day":3,"session":4,"slide":null,"level":"apply","pool":"practice"},{"id":"q-d3-approval","type":"single","prompt":"The retraining pipeline trained a model that passed the gate. Who may promote it?","options":[{"key":"A","text":"The model owner, recording the evidence on the version"},{"key":"B","text":"Any engineer on call"},{"key":"C","text":"The pipeline itself, since the gate passed"},{"key":"D","text":"Nobody until the next quarter"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"A person who answers for the model approves, and the approval travels with the version.","misconceptions":["","Not the model owner","The requester approves its own request","Delays without reason"],"lo":["LO2"],"day":3,"session":4,"slide":null,"level":"understand","pool":"practice"},{"id":"q-d3-retrain-cost","type":"single","prompt":"A retraining run costs 6 SAR of compute and the classifier has 26 SAR left this month. A second drift-triggered retrain is proposed. What else should the decision weigh?","options":[{"key":"A","text":"Nothing: compute is within budget"},{"key":"B","text":"The reviewer's time and the risk of a worse model in a region"},{"key":"C","text":"Only the number of trees"},{"key":"D","text":"The price of tokens"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"Compute is the small part; review and risk are the larger costs of a retrain.","misconceptions":["Ignores the review time and the risk","","Not a cost","The classifier uses no tokens"],"lo":["LO6"],"day":3,"session":4,"slide":null,"level":"apply","pool":"practice"},{"id":"q-d3-skew-retrain","type":"single","prompt":"A drift alert on load was triaged as skew from recalibrated meters. What should the retraining trigger do?","options":[{"key":"A","text":"Retrain early to adapt"},{"key":"B","text":"Retrain at the next schedule with the skewed data"},{"key":"C","text":"Not retrain; the data owner fixes the data"},{"key":"D","text":"Lower the gate tolerance"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"Skew is a data problem; retraining on it bakes the error into the model.","misconceptions":["Learns the measurement error","Same error, later","","Unrelated to the cause"],"lo":["LO2"],"day":3,"session":4,"slide":null,"level":"analyze","pool":"practice"},{"id":"q-d3-retrain-interval","type":"single","prompt":"A run costs 1,500 SAR. Each month a model ages costs 480 SAR a month in missed faults. Monthly runs cost 18,000 SAR a year; every 2 months 11,880; every 3 months 11,760; every 6 months 17,400. Which interval do you choose?","options":[{"key":"A","text":"Every 3 months"},{"key":"B","text":"Every month"},{"key":"C","text":"Every 6 months"},{"key":"D","text":"As often as the budget allows"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"The interval with the lowest total of runs and staleness wins; a drift trigger can still start a run sooner.","misconceptions":["","Pays for runs that buy little when the model ages slowly","Saves on runs but loses more to an old model","Spends to the budget instead of weighing the loss"],"lo":["LO6"],"day":3,"session":4,"slide":null,"level":"apply","pool":"practice"},{"id":"q-d4-bundle-parts","type":"single","prompt":"Which of these belongs in Mubadir's released bundle?","options":[{"key":"A","text":"The session logs of last week"},{"key":"B","text":"The customer database"},{"key":"C","text":"The model provider's weights"},{"key":"D","text":"The sandbox policy of allowed tools and readable fields"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"Prompt, tool schemas, harness settings and sandbox policy together decide behaviour; they are versioned as one bundle.","misconceptions":["Logs are produced by runs, not released","Data the agent reads is not part of its release","The bundle names a model; it does not contain it",""],"lo":["LO5"],"day":4,"session":1,"slide":null,"level":"understand","pool":"practice"},{"id":"q-d4-bundle-version","type":"single","prompt":"A developer adds one property to a tool schema in Mubadir's working copy. What should happen to the bundle version?","options":[{"key":"A","text":"It changes, because a file of the bundle changed"},{"key":"B","text":"Nothing: the prompt is unchanged"},{"key":"C","text":"It changes only if the model is swapped"},{"key":"D","text":"It changes at the next monthly release"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"A content version is a hash of every file, so any change moves it.","misconceptions":["","Treats the prompt as the only behaviour-changing part","Ignores tools, harness and sandbox","A version follows content, not the calendar"],"lo":["LO1"],"day":4,"session":1,"slide":null,"level":"apply","pool":"practice"},{"id":"q-d4-run-released","type":"single","prompt":"Why should Mubadir run only from the released bundle folder and record its version in each session log?","options":[{"key":"A","text":"Because the working copy is slower"},{"key":"B","text":"So an incident can name exactly what was running"},{"key":"C","text":"So developers cannot read the prompt"},{"key":"D","text":"Because session logs need a file name"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"What ran must be what was versioned and tested; the log ties each session to it.","misconceptions":["Speed is not the reason","","Secrecy is not the reason","A name is not the evidence"],"lo":["LO5"],"day":4,"session":1,"slide":null,"level":"apply","pool":"practice"},{"id":"q-d4-resume","type":"single","prompt":"Mubadir's ticket flow crashes after creating a ticket and before notifying the crew. With a checkpointer, what does resuming the same thread do?","options":[{"key":"A","text":"Runs the whole flow again from the start"},{"key":"B","text":"Deletes the ticket and starts again"},{"key":"C","text":"Runs only notify_crew, using the saved ticket id"},{"key":"D","text":"Asks the model what to do next"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"The checkpoint holds the state after each step, so only the missing steps run.","misconceptions":["That is a restart, which opens a second ticket","Nothing is undone on resume","","The saved state already says the next step"],"lo":["LO5"],"day":4,"session":2,"slide":null,"level":"understand","pool":"practice"},{"id":"q-d4-timeout-write","type":"single","prompt":"The ticket service times out on create_ticket and the harness retries. Two tickets appear. What happened?","options":[{"key":"A","text":"The model called the tool twice on purpose"},{"key":"B","text":"The database duplicated a row"},{"key":"C","text":"The checkpointer replayed the step"},{"key":"D","text":"The first call committed before the timeout, so the retry wrote again"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"A timeout does not say whether the write happened.","misconceptions":["The harness retried; the model did not","Each call wrote once","Checkpoints do not run inside one step",""],"lo":["LO5"],"day":4,"session":2,"slide":null,"level":"analyze","pool":"practice"},{"id":"q-d4-idem-key","type":"single","prompt":"Which idempotency key makes create_ticket safe to retry?","options":[{"key":"A","text":"A hash of the session, the tool and its arguments"},{"key":"B","text":"A random number per call"},{"key":"C","text":"The current time in milliseconds"},{"key":"D","text":"The customer's account alone"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"The key must be the same for the same intended write and different for a different one.","misconceptions":["","Each retry gets a new key","Each retry gets a new key","A second, different report from the same customer would be refused"],"lo":["LO5"],"day":4,"session":2,"slide":null,"level":"apply","pool":"practice"},{"id":"q-d4-which-tools-key","type":"single","prompt":"Which of Mubadir's tools most need an idempotency key?","options":[{"key":"A","text":"find_customer"},{"key":"B","text":"create_ticket and notify_crew"},{"key":"C","text":"get_outage"},{"key":"D","text":"None, if there is a checkpointer"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"Writes repeat their effect on retry; reads do not.","misconceptions":["A read can be retried freely","","A read can be retried freely","Checkpoints do not cover a retry inside one step"],"lo":["LO5"],"day":4,"session":2,"slide":null,"level":"understand","pool":"practice"},{"id":"q-d4-replay-why","type":"single","prompt":"Why reproduce INC-0412 by replaying its recording instead of sending the same report again?","options":[{"key":"A","text":"The customer must not be contacted again"},{"key":"B","text":"Replay is cheaper than a model call"},{"key":"C","text":"The recording holds the exact model outputs and tool responses"},{"key":"D","text":"Live runs are not allowed after an incident"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"Services and models have moved on; only the recording returns the same failure every time.","misconceptions":["Not the reason the failure would hide","Cost is a side benefit, not the reason","","Invents a rule"],"lo":["LO5"],"day":4,"session":3,"slide":null,"level":"understand","pool":"practice"},{"id":"q-d4-cause","type":"single","prompt":"In INC-0412, get_outage returned \"restored\" with an age of 140 minutes and Mubadir closed the report. Where does the fix belong?","options":[{"key":"A","text":"A stronger prompt instruction only"},{"key":"B","text":"Deleting the read replica"},{"key":"C","text":"A larger model"},{"key":"D","text":"A guard in the harness that blocks a close on a stale status"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"A harness guard runs on every call and can be tested by replay.","misconceptions":["Followed most of the time, not every time","Removes capacity without checking freshness","The model did what its prompt said",""],"lo":["LO5"],"day":4,"session":3,"slide":null,"level":"analyze","pool":"practice"},{"id":"q-d4-suite","type":"single","prompt":"After adding the freshness guard, which result shows that it is not simply blocking every close?","options":[{"key":"A","text":"The case with a fresh \"restored\" still closes the report"},{"key":"B","text":"The unknown-account case passes"},{"key":"C","text":"The suite runs faster"},{"key":"D","text":"INC-0412 now passes"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"A regression suite keeps a case that must still succeed next to the case that must now be blocked.","misconceptions":["","It never reaches close_report","Speed says nothing about correctness","It would pass if every close were blocked"],"lo":["LO5"],"day":4,"session":3,"slide":null,"level":"apply","pool":"practice"},{"id":"q-d4-gateway","type":"single","prompt":"Why put step and spend limits at the gateway and not only in the harness's max_steps?","options":[{"key":"A","text":"The harness cannot count steps"},{"key":"B","text":"The gateway sees every session of every version and the money spent"},{"key":"C","text":"Gateways make calls faster"},{"key":"D","text":"max_steps is ignored by models"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"A bug or a new bundle can raise the harness limit; the gateway still holds.","misconceptions":["It can; the gateway adds a second, shared check","","Not the reason","The harness enforces it, not the model"],"lo":["LO5"],"day":4,"session":4,"slide":null,"level":"understand","pool":"practice"},{"id":"q-d4-loop-cost","type":"single","prompt":"A runaway session made 80 model calls; input tokens grew from 127 to 3,609 per call. Why did it cost far more than 80 times the first call?","options":[{"key":"A","text":"Output tokens are priced higher"},{"key":"B","text":"The provider raised prices during the loop"},{"key":"C","text":"Each call resends the whole conversation, so calls grow longer"},{"key":"D","text":"Cached tokens are free"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"Cost per call grows with the conversation, so a loop costs roughly with the square of its length.","misconceptions":["Output stayed short","Invents a cause","","Caching would lower the cost, not raise it"],"lo":["LO6"],"day":4,"session":4,"slide":null,"level":"analyze","pool":"practice"},{"id":"q-d4-kill-version","type":"single","prompt":"Every session of Mubadir's new version loops on the same pending status. What does the kill switch stop?","options":[{"key":"A","text":"All of Mubadir, every version"},{"key":"B","text":"The outage service"},{"key":"C","text":"Only the sessions that already hit the limit"},{"key":"D","text":"That version, so the previous version or people keep serving"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"A kill switch per version stops a shared failure without causing an outage of its own.","misconceptions":["Stops the working version too","The agent is the one looping","The others would keep looping",""],"lo":["LO5"],"day":4,"session":4,"slide":null,"level":"apply","pool":"practice"},{"id":"q-d4-handover","type":"single","prompt":"After the kill switch, what must happen to the stopped sessions?","options":[{"key":"A","text":"Keep them with their messages and hand them to people"},{"key":"B","text":"Restart them on the same version"},{"key":"C","text":"Delete them to save storage"},{"key":"D","text":"Send each customer an automatic apology"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"Stored sessions let a person finish the work and let the incident be replayed.","misconceptions":["","They would loop again","Loses customers and the incident evidence","Does not finish the work"],"lo":["LO5"],"day":4,"session":4,"slide":null,"level":"understand","pool":"practice"},{"id":"q-d4-litellm","type":"single","prompt":"In LiteLLM's proxy, which pair of settings puts a daily spend limit on a virtual key?","options":[{"key":"A","text":"rpm_limit and tpm_limit"},{"key":"B","text":"max_budget and budget_duration"},{"key":"C","text":"timeout and retries"},{"key":"D","text":"model_list and api_key"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"max_budget with budget_duration (for example 1d) is a spend limit that resets; budgets need the proxy database.","misconceptions":["Those limit rates, not spend","","Those govern calls, not money","Those configure models"],"lo":["LO6"],"day":4,"session":4,"slide":null,"level":"remember","pool":"practice"}]}</script>

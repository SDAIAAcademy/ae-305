<section>
<h2>Day 1: Version and build</h2>
<ol>
<li><p>Nabd's release file names hosted/steady-latest on both dates, and its answers changed. What should the release record so this cannot hide again?</p><ul><li><b>A.</b> Nothing more: the model name is already in the release</li><li><b>B.</b> The identifier the provider answered with, and a pinned dated identifier in the release</li><li><b>C.</b> The date and time of every call</li><li><b>D.</b> A message to the team whenever answers look different</li></ul></li>
<li><p>You retrain Lamya's model from the shared training file and get the same AUC to three decimals, but the data hash differs from the registry tag. What do you conclude?</p><ul><li><b>A.</b> It is reproduced: the AUC matches</li><li><b>B.</b> The hash function is unreliable across machines</li><li><b>C.</b> Update the registry tag to the new hash</li><li><b>D.</b> It is a different model: rebuild the snapshot from the months in the lineage</li></ul></li>
<li><p>A batch delivers one region's load as a fraction instead of a percentage. Where should the pipeline catch it?</p><ul><li><b>A.</b> In a contract step before training, which stops the run and reports the column</li><li><b>B.</b> In the promotion gate, when the new model's AUC drops</li><li><b>C.</b> When crews complain about the inspection list</li><li><b>D.</b> In a cleaning step that multiplies values below 2 by 100</li></ul></li>
<li><p>Challenger A beats the champion overall (0.851 against 0.830) and is 0.069 worse in Al-Jabal. The tolerance is 0.03. What happens?</p><ul><li><b>A.</b> Promote it: the overall gain is larger than one region's loss</li><li><b>B.</b> Raise the tolerance to 0.07 for this release</li><li><b>C.</b> Reject it, record the region and the cause, and look at challenger B</li><li><b>D.</b> Use A everywhere except Al-Jabal</li></ul></li>
<li><p>Wahaj keeps a release number that people increase by hand. A teammate edits Nabd's tool schema and forgets to increase it. Which practice would have shown the change?</p><ul><li><b>A.</b> A manifest whose release id is a hash of every part</li><li><b>B.</b> A stricter reminder in the team's release checklist</li><li><b>C.</b> Running the evaluation set once a month</li><li><b>D.</b> Keeping the release number in the prompt file</li></ul></li>
<li><p>Nabd's release names a provider alias that ends in "latest". What should each call's log record so that a silent model change shows up in a diff?</p><ul><li><b>A.</b> The prompt text only</li><li><b>B.</b> The model identifier returned in the response</li><li><b>C.</b> The alias the release asked for</li><li><b>D.</b> The number of tokens of the answer</li></ul></li>
<li><p>Nabd's prompt, model and tools are unchanged, but the manuals index was rebuilt with a revised manual. Is this a new release?</p><ul><li><b>A.</b> No: only the data changed, not the system</li><li><b>B.</b> No, unless the answers get worse</li><li><b>C.</b> Yes: the index is part of what changes behaviour</li><li><b>D.</b> Only if the index is larger than before</li></ul></li>
<li><p>You retrain the champion from its registry lineage. Which evidence proves you reproduced it?</p><ul><li><b>A.</b> The same AUC on the holdout to three decimals</li><li><b>B.</b> The same number of trees in both models</li><li><b>C.</b> The same file name for the training data</li><li><b>D.</b> The same data hash, the same code hash and identical predictions row by row</li></ul></li>
<li><p>A retraining script reads the champion's parameters back from the tracking store and passes them straight to the trainer. It fails on the sample weight. Why?</p><ul><li><b>A.</b> The tracking store returns parameters as strings</li><li><b>B.</b> The champion was trained with a different library</li><li><b>C.</b> The registry deleted the parameter after promotion</li><li><b>D.</b> Sample weights cannot be logged</li></ul></li>
<li><p>A monthly batch arrives with one region's load written as a fraction. Which design stops it doing harm?</p><ul><li><b>A.</b> Train, then reject the model if its AUC falls</li><li><b>B.</b> A contract step before training that stops the run and reports the column</li><li><b>C.</b> A cleaning step that rescales small loads</li><li><b>D.</b> Let the crews report odd inspection lists</li></ul></li>
<li><p>Why does Lab 1.3 validate the batch lazily, collecting every failure?</p><ul><li><b>A.</b> It is faster than stopping at the first failure</li><li><b>B.</b> Because pandera cannot stop at the first failure</li><li><b>C.</b> So the data owner can fix every problem in one delivery</li><li><b>D.</b> So the pipeline can repair the failing rows</li></ul></li>
<li><p>A challenger beats the champion overall and is 0.07 AUC worse in one region; the gate's tolerance is 0.03. What should the gate do?</p><ul><li><b>A.</b> Promote: the overall gain outweighs one region</li><li><b>B.</b> Raise the tolerance for this release</li><li><b>C.</b> Promote and watch that region closely</li><li><b>D.</b> Reject it, and record the region and the reason</li></ul></li>
<li><p>Why does the promotion gate allow a small drop in a region instead of none at all?</p><ul><li><b>A.</b> A region's AUC on a few hundred feeders varies by a few hundredths between samples</li><li><b>B.</b> Small regions matter less to the company</li><li><b>C.</b> Challengers are always slightly worse in some region</li><li><b>D.</b> The champion's scores are rounded</li></ul></li>
<li><p>Serving loads models:/fault-risk@champion. What is the release when challenger B passes the gate?</p><ul><li><b>A.</b> Copy B's model file into the service image</li><li><b>B.</b> Move the champion alias to B, keep previous-champion on the old version, tag the reason</li><li><b>C.</b> Delete the old champion version</li><li><b>D.</b> Retrain B on all data and register it</li></ul></li>
</ol>
</section>
<section>
<h2>Day 2: Deliver</h2>
<ol>
<li><p>The fault-risk model's registry version, threshold and code hash are unchanged, but its predictions on the same feeders differ from last week's. What do you check first?</p><ul><li><b>A.</b> Nothing: the model version is the same, so it is noise</li><li><b>B.</b> Retrain and compare the AUC</li><li><b>C.</b> The input data and environment the predictions were made with</li><li><b>D.</b> Lower the promotion tolerance</li></ul></li>
<li><p>The production job checks out the approved commit, builds the image again and deploys it. Staging tested an image built from the same commit an hour earlier. What is wrong?</p><ul><li><b>A.</b> Production may run an artefact nobody tested: it should deploy the digest staging tested</li><li><b>B.</b> Nothing: the same commit gives the same image</li><li><b>C.</b> Nothing: a reviewer approved the commit</li><li><b>D.</b> Only the build time: run both builds at once</li></ul></li>
<li><p>The model swap scores the same as the champion on answer correctness and costs half as much. It fails one of six safety cases. What does the release owner do?</p><ul><li><b>A.</b> Ship it: the average score did not fall</li><li><b>B.</b> Run the gate again until it passes</li><li><b>C.</b> Ship it with a warning in the release notes</li><li><b>D.</b> Block it, log the metric and the case, and raise it with the model's owner</li></ul></li>
<li><p>At 5% the canary served 40 requests in its first pause, with no latency or quality problem. The analysis's minimum sample is 50. What should the rollout do?</p><ul><li><b>A.</b> Advance to 25%: nothing went wrong</li><li><b>B.</b> Report inconclusive and extend the pause before deciding</li><li><b>C.</b> Roll back: the sample is too small</li><li><b>D.</b> Lower the minimum sample to 40 for this release</li></ul></li>
<li><p>A new configuration of Mubadir halves the cost per model call, but the share of reports resolved without a person drops from 0.70 to 0.40. What happens to the cost per resolved report?</p><ul><li><b>A.</b> It halves, like the cost per call</li><li><b>B.</b> It stays the same: the work is the same</li><li><b>C.</b> It falls only slightly, and every unresolved report adds a person's time on top</li><li><b>D.</b> It cannot be known without the token counts</li></ul></li>
<li><p>Staging tested Nabd's image yesterday. Today the production job builds the image again from the same commit and deploys it. Why is this a problem?</p><ul><li><b>A.</b> The commit may have been changed since yesterday</li><li><b>B.</b> A second build takes longer than a deploy</li><li><b>C.</b> The production build may differ from what staging tested</li><li><b>D.</b> Production needs a different tag than staging</li></ul></li>
<li><p>Dhafer wants production deploys of Nabd to need an approval that a pull request cannot remove. Where does he put the rule on GitHub?</p><ul><li><b>A.</b> In a step of the workflow file that waits for a comment</li><li><b>B.</b> In a branch name convention</li><li><b>C.</b> In the README of the repository</li><li><b>D.</b> In the production environment's protection rules</li></ul></li>
<li><p>Dhafer merged a change to Nabd and is also on the production reviewer list. Self-review is blocked. Who can approve the release?</p><ul><li><b>A.</b> Another listed reviewer, such as Mutab</li><li><b>B.</b> Anyone in the team with write access</li><li><b>C.</b> Dhafer, because he is a reviewer</li><li><b>D.</b> Nobody: the release must be merged again by someone else</li></ul></li>
<li><p>A candidate release of Nabd changes the prompt and the model at once, and the gate blocks it. What is the main drawback of this release?</p><ul><li><b>A.</b> It costs more to evaluate</li><li><b>B.</b> The result does not say which change caused the block</li><li><b>C.</b> It must be rolled back twice</li><li><b>D.</b> The gate cannot run on two changes</li></ul></li>
<li><p>A cheaper model keeps answer correctness at 0.917 but completes 5 of 6 safety procedures. The gate has a floor of 1.00 on safety steps. What is the decision?</p><ul><li><b>A.</b> Ship: the overall score is unchanged</li><li><b>B.</b> Ship to half the crews to compare</li><li><b>C.</b> Block, and log the safety metric and the failing case</li><li><b>D.</b> Rerun the gate until it passes</li></ul></li>
<li><p>The platform team refreshes Nabd's manuals index without changing code, prompt or model. Should the refresh go through the evaluation gate?</p><ul><li><b>A.</b> Only if the number of chunks changes</li><li><b>B.</b> No: no code changed</li><li><b>C.</b> No: new manuals can only improve answers</li><li><b>D.</b> Yes: it changes what the model reads</li></ul></li>
<li><p>At 5% the canary served 30 requests in its pause with no problems. The analysis's minimum sample is 50. What should happen?</p><ul><li><b>A.</b> Report inconclusive and extend the pause</li><li><b>B.</b> Roll back</li><li><b>C.</b> Advance to 25%</li><li><b>D.</b> Lower the minimum sample for this release</li></ul></li>
<li><p>Why does the canary analysis compare the candidate's graded answers with the stable version's grades on the same requests rather than with last week's average?</p><ul><li><b>A.</b> Last week's average is not stored</li><li><b>B.</b> The same requests remove the effect of a changing question mix</li><li><b>C.</b> It makes the canary faster</li><li><b>D.</b> The stable version is always right</li></ul></li>
<li><p>A new model snapshot passed the offline gate and 30 minutes of shadow, then failed at 25% when the next shift asked mostly in Arabic. What should change before the next attempt?</p><ul><li><b>A.</b> Skip the shadow: it was misleading</li><li><b>B.</b> Raise the latency objective</li><li><b>C.</b> Add Arabic cases offline and shadow across a shift change</li><li><b>D.</b> Go straight to 50% to get a larger sample</li></ul></li>
<li><p>A new reply style for Mubadir won offline. It went live in one region first, and that region now has 9 points fewer repeat contacts than the others. How do you measure the style's own effect?</p><ul><li><b>A.</b> Compare the region with the other five regions again over the next month</li><li><b>B.</b> Compare the region with its own month before the change</li><li><b>C.</b> Assign accounts at random in every region and compare the two arms</li><li><b>D.</b> Grade the new replies with the offline grader on live traffic</li></ul></li>
<li><p>A configuration halves Mubadir's cost per model call, but its resolved share drops from 0.70 to 0.40. About how does the cost per resolved report change?</p><ul><li><b>A.</b> It halves</li><li><b>B.</b> It is unchanged</li><li><b>C.</b> It doubles</li><li><b>D.</b> It falls only slightly, and unresolved reports need a person</li></ul></li>
<li><p>Someone added the current date as the first line of Nabd's system prompt, and the cache hit rate fell from 0.62 to 0.12. Why?</p><ul><li><b>A.</b> Prompt caches match the start of a request, and the start now changes daily</li><li><b>B.</b> The provider stopped caching dates</li><li><b>C.</b> Dates make prompts longer</li><li><b>D.</b> Cached tokens expire at midnight</li></ul></li>
<li><p>A month-end forecast alert fires for the fault-risk classifier on the 7th; its spend jumped on the day of the planned monthly retrain. What is the best fix?</p><ul><li><b>A.</b> Remove budget alerts for the classifier</li><li><b>B.</b> Forecast planned jobs separately from daily running cost</li><li><b>C.</b> Raise the classifier's budget until the alert stops</li><li><b>D.</b> Alert only on the last day of the month</li></ul></li>
<li><p>Finance asks why AI costs are shown per team instead of as one platform bill. What is the main reason?</p><ul><li><b>A.</b> It is required to move money between teams</li><li><b>B.</b> It makes the total bill smaller</li><li><b>C.</b> Teams decide their use, so seeing their own cost changes their choices</li><li><b>D.</b> It hides the cost of the platform team</li></ul></li>
</ol>
</section>
<section>
<h2>Day 3: Observe</h2>
<ol>
<li><p>A new snapshot passed the offline gate and its shadow run, then the canary at 25% rolled back. What made the difference?</p><ul><li><b>A.</b> The offline gate was run again with more cases</li><li><b>B.</b> Real traffic at 25% included the Arabic-heavy shift the earlier evidence never saw</li><li><b>C.</b> The shadow run had failed and was ignored</li><li><b>D.</b> A reviewer refused the release at 25%</li></ul></li>
<li><p>A trace of a slow Nabd request shows the retrieval span at 260 ms and each model span at 80 ms. The team proposes a faster model. What do you say?</p><ul><li><b>A.</b> Agree: model calls are usually the slow part</li><li><b>B.</b> Collect a month of traces before deciding</li><li><b>C.</b> Add more replicas of Nabd</li><li><b>D.</b> Fix retrieval first, then measure again with the same spans</li></ul></li>
<li><p>Temperature's PSI is 1.56 on day 8, then below 0.1 the next day. The monitor needs three days in a row above 0.2. What happens, and is it right?</p><ul><li><b>A.</b> An alert fires: 1.56 is far above 0.2</li><li><b>B.</b> No alert: a one-day heat spike is weather, and it is logged</li><li><b>C.</b> The monitor is broken and must be retuned</li><li><b>D.</b> Retrain to include the hot day</li></ul></li>
<li><p>The grader fails 29% of a sample. On labelled traces it fails 90% of bad answers and passes 82% of good ones. What do you report?</p><ul><li><b>A.</b> 29% of Nabd's answers are wrong</li><li><b>B.</b> About 32%: the grader misses a tenth of the bad answers</li><li><b>C.</b> About 15% after correction, with the raw rate and the sample sizes</li><li><b>D.</b> Nothing until every trace is reviewed by hand</li></ul></li>
<li><p>On 20 September a drift alert fires on dust for August's feeders. August's labels are complete on 2 October; a first cut exists. What does the policy do?</p><ul><li><b>A.</b> Retrain now on the first cut</li><li><b>B.</b> Ignore the alert: the schedule will retrain anyway</li><li><b>C.</b> Lower the champion's threshold until labels arrive</li><li><b>D.</b> Wait for the complete labels, then retrain and gate</li></ul></li>
<li><p>Nabd's logs say a request took 500 ms. What does a trace add?</p><ul><li><b>A.</b> The cost of the request</li><li><b>B.</b> The average time of all requests that day</li><li><b>C.</b> The text of the answer</li><li><b>D.</b> The time of each step of that request, nested under it</li></ul></li>
<li><p>Ten traces show retrieval at 71% of request time and model calls at 27%. Where do you start?</p><ul><li><b>A.</b> Find why retrieval is slow and fix it, then measure again</li><li><b>B.</b> Add replicas</li><li><b>C.</b> Swap to a faster model</li><li><b>D.</b> Remove the tool calls</li></ul></li>
<li><p>A developer wants to record every crew question as a span attribute. Questions sometimes contain a customer's phone number. What is the rule?</p><ul><li><b>A.</b> Record it: traces are internal</li><li><b>B.</b> Record it only after redaction, and only if a purpose needs it</li><li><b>C.</b> Record it only on error spans</li><li><b>D.</b> Record it and delete the trace store yearly</li></ul></li>
<li><p>Which span name follows the OpenTelemetry GenAI conventions for one model call of Nabd?</p><ul><li><b>A.</b> nabd.model.call</li><li><b>B.</b> LLM</li><li><b>C.</b> chat steady</li><li><b>D.</b> retrieval steady</li></ul></li>
<li><p>A drift monitor alerts every hot day in summer. Which change removes these alarms but still catches a shift that lasts?</p><ul><li><b>A.</b> Raise the threshold to 2.0</li><li><b>B.</b> Remove temperature from the monitor</li><li><b>C.</b> Monitor once a month</li><li><b>D.</b> Alert only on three judged days in a row</li></ul></li>
<li><p>The monitor compares each day with the previous seven days. What can it no longer see?</p><ul><li><b>A.</b> A slow drift over months</li><li><b>B.</b> A one-day spike</li><li><b>C.</b> A step change overnight</li><li><b>D.</b> A day with few feeders</li></ul></li>
<li><p>Serving load jumps 12% overnight while temperatures fall. The SCADA team recalibrated meters that night. What should Lamya do?</p><ul><li><b>A.</b> Retrain at once on the new values</li><li><b>B.</b> Treat it as skew and fix the data with the SCADA team before any retraining</li><li><b>C.</b> Ignore it: load is only one feature</li><li><b>D.</b> Lower the alert threshold</li></ul></li>
<li><p>On maintenance-freeze days only 120 feeders are scored instead of 400. Why does the monitor not judge those days?</p><ul><li><b>A.</b> The feeders are not important</li><li><b>B.</b> The data is corrupt on those days</li><li><b>C.</b> A small sample makes the statistic noisy</li><li><b>D.</b> The model is not used on those days</li></ul></li>
<li><p>A replacement fault-risk model has been scored in shadow for two weeks. Faults reported so far favour it slightly, but most Al-Jabal faults are found weeks later. What should you add before deciding?</p><ul><li><b>A.</b> Two more weeks of the same early faults</li><li><b>B.</b> A lower alert threshold on the shadow scores</li><li><b>C.</b> The share of today's feeders on which the two models' top lists agree</li><li><b>D.</b> A backtest on a complete month and a random inspected sample</li></ul></li>
<li><p>Where in the online evaluation should personal data be removed from Nabd's traces?</p><ul><li><b>A.</b> Before they are shown to reviewers</li><li><b>B.</b> Never: the grader needs it</li><li><b>C.</b> After a year</li><li><b>D.</b> Before they are stored</li></ul></li>
<li><p>A grader fails 29% of sampled answers. On labelled traces it fails 90% of bad answers and passes 82% of good ones. About what failure rate do you report?</p><ul><li><b>A.</b> 15%, with the raw rate and the sample sizes</li><li><b>B.</b> 29%</li><li><b>C.</b> 10%</li><li><b>D.</b> 32%</li></ul></li>
<li><p>Why does the review queue include a few answers the grader passed?</p><ul><li><b>A.</b> To keep reviewers busy</li><li><b>B.</b> To see what the grader lets through and keep its numbers current</li><li><b>C.</b> To check the grader's speed</li><li><b>D.</b> Because passes are usually wrong</li></ul></li>
<li><p>Traces are kept 3 days for debugging. Some are in the review queue on day 7. What does the retention rule do with them?</p><ul><li><b>A.</b> Deletes them with the others</li><li><b>B.</b> Keeps them forever</li><li><b>C.</b> Holds them until reviewed, then deletes them</li><li><b>D.</b> Keeps all traces until the queue is empty</li></ul></li>
<li><p>A drift alert fires on 20 September for August's feeders. August's labels are complete on 2 October. What does the retraining policy do?</p><ul><li><b>A.</b> Promote the last challenger</li><li><b>B.</b> Retrain now on the first cut</li><li><b>C.</b> Ignore the alert</li><li><b>D.</b> Wait for complete labels, then retrain and gate</li></ul></li>
<li><p>The retraining pipeline trained a model that passed the gate. Who may promote it?</p><ul><li><b>A.</b> The model owner, recording the evidence on the version</li><li><b>B.</b> Any engineer on call</li><li><b>C.</b> The pipeline itself, since the gate passed</li><li><b>D.</b> Nobody until the next quarter</li></ul></li>
<li><p>A retraining run costs 6 SAR of compute and the classifier has 26 SAR left this month. A second drift-triggered retrain is proposed. What else should the decision weigh?</p><ul><li><b>A.</b> Nothing: compute is within budget</li><li><b>B.</b> The reviewer's time and the risk of a worse model in a region</li><li><b>C.</b> Only the number of trees</li><li><b>D.</b> The price of tokens</li></ul></li>
<li><p>A drift alert on load was triaged as skew from recalibrated meters. What should the retraining trigger do?</p><ul><li><b>A.</b> Retrain early to adapt</li><li><b>B.</b> Retrain at the next schedule with the skewed data</li><li><b>C.</b> Not retrain; the data owner fixes the data</li><li><b>D.</b> Lower the gate tolerance</li></ul></li>
<li><p>A run costs 1,500 SAR. Each month a model ages costs 480 SAR a month in missed faults. Monthly runs cost 18,000 SAR a year; every 2 months 11,880; every 3 months 11,760; every 6 months 17,400. Which interval do you choose?</p><ul><li><b>A.</b> Every 3 months</li><li><b>B.</b> Every month</li><li><b>C.</b> Every 6 months</li><li><b>D.</b> As often as the budget allows</li></ul></li>
</ol>
</section>
<section>
<h2>Day 4: Operate agents</h2>
<ol>
<li><p>Three input alerts fired last week: dust high for one day, load 10% higher every day since Tuesday's meter recalibration, temperature slowly falling over a month. Which one needs action today?</p><ul><li><b>A.</b> Dust, because its PSI was the largest</li><li><b>B.</b> Temperature, because it moved for a month</li><li><b>C.</b> Load: a step since a known change, likely skew, so call the data owner</li><li><b>D.</b> None: inputs do not matter until labels arrive</li></ul></li>
<li><p>A developer raises Mubadir's max_steps from 10 to 30 in harness.yaml and says no release is needed because the prompt did not change. What do you answer?</p><ul><li><b>A.</b> Agree: only the prompt changes what the agent does</li><li><b>B.</b> It is a new bundle version: harness settings change behaviour and cost</li><li><b>C.</b> It is enough to note it in the session log</li><li><b>D.</b> Only a sandbox change needs a release</li></ul></li>
<li><p>Mubadir's flow now has a checkpointer. A ticket service timeout still produced two tickets for one report. Why?</p><ul><li><b>A.</b> The checkpointer was not saving</li><li><b>B.</b> The ticket database lost the first ticket</li><li><b>C.</b> The retry ran inside one step, and the service had no key to recognise it</li><li><b>D.</b> The model asked for two tickets</li></ul></li>
<li><p>The team wants to reproduce INC-0412 by sending the same customer report to Mubadir today. Why will that probably not show the failure?</p><ul><li><b>A.</b> The replica has caught up and the model may answer differently: only the recording holds what happened</li><li><b>B.</b> The customer's account has been deleted</li><li><b>C.</b> The new guard will block it</li><li><b>D.</b> Agents never behave the same way twice</li></ul></li>
<li><p>Every session of Mubadir's new version loops on the same pending status. Each stops at the step limit. What does the duty engineer do?</p><ul><li><b>A.</b> Nothing: the step limit already stops each session</li><li><b>B.</b> Stop all of Mubadir, every version</li><li><b>C.</b> Raise the step limit so sessions can finish</li><li><b>D.</b> Turn on the kill switch for that version and hand its sessions to people</li></ul></li>
<li><p>Which of these belongs in Mubadir's released bundle?</p><ul><li><b>A.</b> The session logs of last week</li><li><b>B.</b> The customer database</li><li><b>C.</b> The model provider's weights</li><li><b>D.</b> The sandbox policy of allowed tools and readable fields</li></ul></li>
<li><p>A developer adds one property to a tool schema in Mubadir's working copy. What should happen to the bundle version?</p><ul><li><b>A.</b> It changes, because a file of the bundle changed</li><li><b>B.</b> Nothing: the prompt is unchanged</li><li><b>C.</b> It changes only if the model is swapped</li><li><b>D.</b> It changes at the next monthly release</li></ul></li>
<li><p>Why should Mubadir run only from the released bundle folder and record its version in each session log?</p><ul><li><b>A.</b> Because the working copy is slower</li><li><b>B.</b> So an incident can name exactly what was running</li><li><b>C.</b> So developers cannot read the prompt</li><li><b>D.</b> Because session logs need a file name</li></ul></li>
<li><p>Mubadir's ticket flow crashes after creating a ticket and before notifying the crew. With a checkpointer, what does resuming the same thread do?</p><ul><li><b>A.</b> Runs the whole flow again from the start</li><li><b>B.</b> Deletes the ticket and starts again</li><li><b>C.</b> Runs only notify_crew, using the saved ticket id</li><li><b>D.</b> Asks the model what to do next</li></ul></li>
<li><p>The ticket service times out on create_ticket and the harness retries. Two tickets appear. What happened?</p><ul><li><b>A.</b> The model called the tool twice on purpose</li><li><b>B.</b> The database duplicated a row</li><li><b>C.</b> The checkpointer replayed the step</li><li><b>D.</b> The first call committed before the timeout, so the retry wrote again</li></ul></li>
<li><p>Which idempotency key makes create_ticket safe to retry?</p><ul><li><b>A.</b> A hash of the session, the tool and its arguments</li><li><b>B.</b> A random number per call</li><li><b>C.</b> The current time in milliseconds</li><li><b>D.</b> The customer's account alone</li></ul></li>
<li><p>Which of Mubadir's tools most need an idempotency key?</p><ul><li><b>A.</b> find_customer</li><li><b>B.</b> create_ticket and notify_crew</li><li><b>C.</b> get_outage</li><li><b>D.</b> None, if there is a checkpointer</li></ul></li>
<li><p>Why reproduce INC-0412 by replaying its recording instead of sending the same report again?</p><ul><li><b>A.</b> The customer must not be contacted again</li><li><b>B.</b> Replay is cheaper than a model call</li><li><b>C.</b> The recording holds the exact model outputs and tool responses</li><li><b>D.</b> Live runs are not allowed after an incident</li></ul></li>
<li><p>In INC-0412, get_outage returned "restored" with an age of 140 minutes and Mubadir closed the report. Where does the fix belong?</p><ul><li><b>A.</b> A stronger prompt instruction only</li><li><b>B.</b> Deleting the read replica</li><li><b>C.</b> A larger model</li><li><b>D.</b> A guard in the harness that blocks a close on a stale status</li></ul></li>
<li><p>After adding the freshness guard, which result shows that it is not simply blocking every close?</p><ul><li><b>A.</b> The case with a fresh "restored" still closes the report</li><li><b>B.</b> The unknown-account case passes</li><li><b>C.</b> The suite runs faster</li><li><b>D.</b> INC-0412 now passes</li></ul></li>
<li><p>Why put step and spend limits at the gateway and not only in the harness's max_steps?</p><ul><li><b>A.</b> The harness cannot count steps</li><li><b>B.</b> The gateway sees every session of every version and the money spent</li><li><b>C.</b> Gateways make calls faster</li><li><b>D.</b> max_steps is ignored by models</li></ul></li>
<li><p>A runaway session made 80 model calls; input tokens grew from 127 to 3,609 per call. Why did it cost far more than 80 times the first call?</p><ul><li><b>A.</b> Output tokens are priced higher</li><li><b>B.</b> The provider raised prices during the loop</li><li><b>C.</b> Each call resends the whole conversation, so calls grow longer</li><li><b>D.</b> Cached tokens are free</li></ul></li>
<li><p>Every session of Mubadir's new version loops on the same pending status. What does the kill switch stop?</p><ul><li><b>A.</b> All of Mubadir, every version</li><li><b>B.</b> The outage service</li><li><b>C.</b> Only the sessions that already hit the limit</li><li><b>D.</b> That version, so the previous version or people keep serving</li></ul></li>
<li><p>After the kill switch, what must happen to the stopped sessions?</p><ul><li><b>A.</b> Keep them with their messages and hand them to people</li><li><b>B.</b> Restart them on the same version</li><li><b>C.</b> Delete them to save storage</li><li><b>D.</b> Send each customer an automatic apology</li></ul></li>
<li><p>In LiteLLM's proxy, which pair of settings puts a daily spend limit on a virtual key?</p><ul><li><b>A.</b> rpm_limit and tpm_limit</li><li><b>B.</b> max_budget and budget_duration</li><li><b>C.</b> timeout and retries</li><li><b>D.</b> model_list and api_key</li></ul></li>

ext":"Retrain and compare the AUC"},{"key":"C","text":"The input data and environment the predictions were made with"},{"key":"D","text":"Lower the promotion tolerance"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"With model, configuration and code pinned, the remaining parts of the release are the data and the environment, and the manifest says which one moved.","misconceptions":["Assumes behaviour comes from the model file alone","Starts with the most expensive action before reading the record","","Changes the rule that would have explained the difference"],"lo":["LO1","LO2"],"day":2,"session":null,"slide":{"deck":"day2","id":"review-day-1","title":"Which part of the release unit changed?"},"level":null,"pool":"checkpoint"},{"id":"checkpoint-1-q1","type":"single","prompt":"The production job checks out the approved commit, builds the image again and deploys it. Staging tested an image built from the same commit an hour earlier. What is wrong?","options":[{"key":"A","text":"Production may run an artefact nobody tested: it should deploy the digest staging tested"},{"key":"B","text":"Nothing: the same commit gives the same image"},{"key":"C","text":"Nothing: a reviewer approved the commit"},{"key":"D","text":"Only the build time: run both builds at once"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"Identity is the digest. A second build can differ, and then the evidence from staging is about something else.","misconceptions":["","Assumes a commit fully determines an image, ignoring base images and package updates","Treats the approval as the safeguard against a different artefact","Adds time, not identity: a later build can still differ"],"lo":["LO3"],"day":2,"session":1,"slide":{"deck":"day2","id":"checkpoint-1","title":"Approved, then rebuilt"},"level":null,"pool":"checkpoint"},{"id":"checkpoint-2-q1","type":"single","prompt":"The model swap scores the same as the champion on answer correctness and costs half as much. It fails one of six safety cases. What does the release owner do?","options":[{"key":"A","text":"Ship it: the average score did not fall"},{"key":"B","text":"Run the gate again until it passes"},{"key":"C","text":"Ship it with a warning in the release notes"},{"key":"D","text":"Block it, log the metric and the case, and raise it with the model's owner"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"The safety floor was set before the release because an incomplete isolation procedure can hurt someone. Cost does not trade against it.","misconceptions":["Lets the average decide a rule written as a floor","Treats a safety failure as a sample-size question","Moves the risk to crews without telling them which procedure fails",""],"lo":["LO3"],"day":2,"session":2,"slide":{"deck":"day2","id":"checkpoint-2","title":"Same score, blocked"},"level":null,"pool":"checkpoint"},{"id":"checkpoint-3-q1","type":"single","prompt":"At 5% the canary served 40 requests in its first pause, with no latency or quality problem. The analysis's minimum sample is 50. What should the rollout do?","options":[{"key":"A","text":"Advance to 25%: nothing went wrong"},{"key":"B","text":"Report inconclusive and extend the pause before deciding"},{"key":"C","text":"Roll back: the sample is too small"},{"key":"D","text":"Lower the minimum sample to 40 for this release"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"A short clean window says little. The rule waits for enough requests and, if still short, hands the decision to a person.","misconceptions":["Reads absence of evidence as evidence of absence","","Punishes a candidate for low traffic, not for a problem","Changes the rule mid-release to fit the data"],"lo":["LO3"],"day":2,"session":3,"slide":{"deck":"day2","id":"checkpoint-3","title":"A clean first window"},"level":null,"pool":"checkpoint"},{"id":"checkpoint-4-q1","type":"single","prompt":"A new configuration of Mubadir halves the cost per model call, but the share of reports resolved without a person drops from 0.70 to 0.40. What happens to the cost per resolved report?","options":[{"key":"A","text":"It halves, like the cost per call"},{"key":"B","text":"It stays the same: the work is the same"},{"key":"C","text":"It falls only slightly, and every unresolved report adds a person's time on top"},{"key":"D","text":"It cannot be known without the token counts"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"Half the cost spread over 0.40 instead of 0.70 successes is 0.5 × 0.70 / 0.40 ≈ 0.88 of the old cost per success, and the extra failures, 30 more in every 100 reports, each need a person.","misconceptions":["Divides by calls instead of outcomes","Ignores that every unresolved report still cost its calls","","Assumes tokens are the only cost of a failure"],"lo":["LO6"],"day":2,"session":4,"slide":{"deck":"day2","id":"checkpoint-4","title":"Cheaper per call"},"level":null,"pool":"checkpoint"},{"id":"review-day-2-q1","type":"single","prompt":"A new snapshot passed the offline gate and its shadow run, then the canary at 25% rolled back. What made the difference?","options":[{"key":"A","text":"The offline gate was run again with more cases"},{"key":"B","text":"Real traffic at 25% included the Arabic-heavy shift the earlier evidence never saw"},{"key":"C","text":"The shadow run had failed and was ignored"},{"key":"D","text":"A reviewer refused the release at 25%"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"Each instrument only tests the traffic it sees. The canary's analysis saw 43% Arabic requests and its latency trigger fired.","misconceptions":["The gate's cases did not change between the two runs","","The shadow looked better than stable; it did not trigger anything","A canary has no reviewer in the loop; the trigger acted on its own"],"lo":["LO3"],"day":3,"session":null,"slide":{"deck":"day3","id":"review-day-2","title":"Which evidence ro

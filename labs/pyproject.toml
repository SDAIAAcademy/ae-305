[project]
name = "ae-305-labs"
version = "2027.1.0"
description = "Lab notebooks for the SDAIA Academy course AE-305 Operating Machine Learning and Language Model Systems (case: Wahaj Electricity Distribution Company)"
requires-python = ">=3.11,<3.14"
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "scipy>=1.14",
    "scikit-learn>=1.6",
    "mlflow>=3.4",
    "pandera>=0.24",
    "pyyaml>=6.0",
    "opentelemetry-sdk>=1.37",
    "langgraph>=1.0",
    "langgraph-checkpoint-sqlite>=2.0",
    "openai>=1.100",
    "python-dotenv>=1.1",
    "matplotlib>=3.9",
    "jupyterlab>=4.4",
    "ipykernel>=6.29",
    "nbclient>=0.10",
]

[tool.uv]
package = false
